volumes:
  mongo-data:

networks:
  docker-lab-network:
    driver: bridge

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: docker-lab-app
    ports:
      - "${APP_PORT_EXTERNAL}:3000"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB}
      MONGO_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_PASSWORD: ${MONGO_APP_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - docker-lab-network
    user: "node"

  mongodb:
    image: mongo:7
    container_name: docker-lab-mongo
    command: ["mongod", "--bind_ip_all", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    ports:
      - "${MONGO_PORT_EXTERNAL}:27017"
    volumes:
      - mongo-data:/data/db
      - ./app/config/mongo-init.js:/docker-entrypoint-initdb.d/01-create-app-user.js:ro
    networks:
      - docker-lab-network

  mongo-express:
    image: mongo-express:1.0
    container_name: docker-lab-mongo-express
    restart: always
    ports:
      - "${MONGO_EXPRESS_PORT_EXTERNAL}:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      - mongodb
    networks:
      - docker-lab-network
